name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ===== Stage 1: 快速失败 — lint + 单元测试 (并行) =====
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - name: Go format check
        run: |
          cd cmd/gateway-grpc
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin
          cd ../../services/notify-service
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin

      - name: C++ auto-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          find server/src server/include -name '*.cpp' -o -name '*.h' | xargs clang-format -i
          echo "C++ files formatted"

      - name: C++ format check
        run: |
          find server/src server/include -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  # ===== Stage 2: 构建 + 集成测试 =====
  integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: lcb66699
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Pull upstream images (with retry)
        run: |
          IMAGES="nginx redis-cluster-1 redis-cluster-2 redis-cluster-3 \
                  redis-cluster-4 redis-cluster-5 redis-cluster-6 \
                  mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-1 \
                  mysql-file-0 mysql-file-1 minio elasticsearch jaeger"
          for img in $IMAGES; do
            for attempt in 1 2 3; do
              echo "[pull] $img attempt $attempt"
              if docker compose pull "$img" 2>&1; then
                echo "[pull] $img OK"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "[pull] $img FAILED after 3 attempts, continuing"
              else
                sleep $((attempt * 10))
              fi
            done
          done

      - name: Build images (BuildKit with cache mounts)
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          BUILDKIT_INLINE_CACHE: "1"
        run: docker compose build

      - name: Start services
        env:
          LOG_LEVEL: debug
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          rm -rf data/ 2>/dev/null || true
          docker compose up -d --no-build \
            envoy envoy-2 nginx grpc-gateway \
            auth-1 sheet-1 file-1 search \
            mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-0-slave mysql-spreadsheet-1 mysql-file-0 mysql-file-0-slave mysql-file-1 \
            minio minio-init redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init \
            elasticsearch es-init jaeger
          echo "Waiting for all containers healthy..."
          for i in $(seq 1 180); do
            TOTAL=$(docker compose ps -a --format json 2>/dev/null | wc -l)
            HEALTHY=$(docker compose ps -a --format json 2>/dev/null | grep -c '"Health":"healthy"' || true)
            EXITED_OK=$(docker compose ps -a --format json 2>/dev/null | grep -c '"ExitCode":0' || true)
            OK=$((HEALTHY + EXITED_OK))
            if [ "$OK" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "All containers healthy after ${i}s ($TOTAL total)"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "Timeout! unhealthy containers:"
              docker compose ps -a
              exit 1
            fi
            sleep 2
          done
          echo "=== Services status ==="
          docker compose ps

      - name: Debug - Nginx to Envoy connectivity
        run: |
          echo "=== DNS: resolving envoy from nginx ==="
          docker compose exec nginx sh -c "nslookup envoy 2>/dev/null || getent hosts envoy || ping -c1 envoy || true"
          echo "=== DNS: resolving envoy-2 from nginx ==="
          docker compose exec nginx sh -c "nslookup envoy-2 2>/dev/null || getent hosts envoy-2 || ping -c1 envoy-2 || true"
          echo "=== TCP: nginx -> envoy:10000 ==="
          docker compose exec nginx sh -c "(echo > /dev/tcp/envoy/10000 && echo 'OK envoy:10000') 2>&1 || echo 'FAIL envoy:10000'"
          echo "=== TCP: nginx -> envoy-2:10000 ==="
          docker compose exec nginx sh -c "(echo > /dev/tcp/envoy-2/10000 && echo 'OK envoy-2:10000') 2>&1 || echo 'FAIL envoy-2:10000'"
          echo "=== Curl: nginx -> envoy:10000/health ==="
          docker compose exec nginx sh -c "wget -qO- --timeout=3 http://envoy:10000/api/v1/health 2>&1 || curl -sS --max-time 3 http://envoy:10000/api/v1/health 2>&1 || echo 'FAIL curl envoy'"
          echo "=== Curl: envoy -> grpc-gateway:8080/health ==="
          docker compose exec envoy sh -c "curl -sS --max-time 3 http://grpc-gateway:8080/api/v1/health 2>&1 || wget -qO- --timeout=3 http://grpc-gateway:8080/api/v1/health 2>&1 || echo 'FAIL curl gateway'"

      - name: Functional tests
        run: bash test/e2e/functional_test.sh

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== sheet-1 ===" && docker compose logs sheet-1 --tail=40
          echo "=== file-1 ===" && docker compose logs file-1 --tail=40
          echo "=== grpc-gateway ===" && docker compose logs grpc-gateway --tail=20
          echo "=== auth-1 ===" && docker compose logs auth-1 --tail=10
          echo "=== mysql-spreadsheet-0 ===" && docker compose logs mysql-spreadsheet-0 --tail=10
          echo "=== mysql-spreadsheet-1 ===" && docker compose logs mysql-spreadsheet-1 --tail=10
          echo "=== envoy ===" && docker compose logs envoy --tail=20
          echo "=== envoy-2 ===" && docker compose logs envoy-2 --tail=20
          echo "=== nginx ===" && docker compose logs nginx --tail=20

  # ===== Stage 3: 推送镜像到 ghcr.io (仅 main 分支) =====
  push:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: lcb66699
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build & push
        env:
          DOCKER_USER: ghcr.io/lcb66699/http-rpc
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          docker compose build base-runtime auth-1 sheet-1 file-1 search grpc-gateway notify-service
          docker compose push base-runtime auth-1 sheet-1 file-1 search grpc-gateway notify-service

  # ===== Stage 4: 自动部署到 Ubuntu (仅 main 分支) =====
  deploy:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/HTTP-RPC
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOCKER_USER=ghcr.io/lcb66699/http-rpc
            docker compose pull auth-1 auth-2 sheet-1 sheet-2 file-1 file-2 search grpc-gateway grpc-gateway-2 notify-service
            docker compose up -d
            docker image prune -f
