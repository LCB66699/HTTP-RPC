syntax = "proto3";
package rpc;
option go_package = "gateway-grpc/gen/rpc";

// 服务端错误码，用于 Gateway 映射 HTTP 状态码。
// 与 string error 并行使用，语义明确，不依赖文案匹配。
enum ErrorCode {
    OK = 0;
    BAD_REQUEST = 1;            // 400 参数校验失败
    UNAUTHENTICATED = 2;        // 401 未登录/令牌无效
    FORBIDDEN = 3;              // 403 无权访问
    NOT_FOUND = 4;              // 404 资源不存在
    CONFLICT = 5;               // 409 重复/冲突
    INTERNAL = 6;               // 500 服务内部错误
    UNAVAILABLE = 7;            // 503 依赖服务不可用
}
