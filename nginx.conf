worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # 令牌桶限流：单 IP 1000r/s，突发 200 排队
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;

    # 登录接口防爆破：单 IP 5r/m（5 次/分钟）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # upstream 双 gateway 实例，least_conn + 故障转移
    upstream gateway_pool {
        least_conn;
        server gateway-1:8081 max_fails=2 fail_timeout=10s;
        server gateway-2:8081 max_fails=2 fail_timeout=10s;
        keepalive 128;
        keepalive_timeout 60s;
        keepalive_requests 10000;
    }

    # HTTP → 重定向到 HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        # 结构化错误响应
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"success":false,"error":"Rate limited","retry_after":30}';
        }
        error_page 413 /413.json;
        location = /413.json {
            default_type application/json;
            return 413 '{"success":false,"error":"Request body too large","max_size_mb":50}';
        }

        location / {
            root /app/web-ui;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/login {
            limit_req zone=login_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            send_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
        location /api/register {
            limit_req zone=login_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            send_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # File upload/download — longer timeout for large files
        location /api/files/upload {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            client_max_body_size 50m;
        }
        location /api/files/download {
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_connect_timeout 3s;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            send_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            client_max_body_size 50m;
        }

        location /minio-s3/ {
            proxy_pass http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            send_timeout 120s;
            client_max_body_size 50m;
        }
    }
}
