global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway-grpc'
    scrape_interval: 10s
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets:
          - 'grpc-gateway:8080'
          - 'grpc-gateway-2:8080'
        labels:
          service: 'gateway'
