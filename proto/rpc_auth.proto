syntax = "proto3";

package rpc;

option go_package = "rpc-server/proto/rpc";

import "google/api/annotations.proto";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/login"
      body: "*"
    };
  }
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/register"
      body: "*"
    };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/refresh"
      body: "*"
    };
  }
  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/validate"
    };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {
    option (google.api.http) = {
      put: "/api/v1/me/password"
      body: "*"
    };
  }
  rpc LoginByPhone(PhoneLoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/phone/login"
      body: "*"
    };
  }
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string error = 3;
  int32 error_code = 99;  // 0=OK, 1=BAD_REQUEST, 2=UNAUTH, 3=FORBIDDEN, 4=NOT_FOUND, 5=CONFLICT, 6=INTERNAL, 7=UNAVAILABLE
  int64 user_id = 4;
  string access_token = 5;      // JWT, 15min
  string refresh_token = 6;     // UUID, 7d
  string role = 7;              // admin / user
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  bool success = 1;
  string error = 3;
  int32 error_code = 99;
  int64 user_id = 4;
  string access_token = 5;
  string refresh_token = 6;
  string role = 7;
}

message RefreshTokenRequest {
  string username = 1;
  string refresh_token = 2;
}

message RefreshTokenResponse {
  bool success = 1;
  string error = 2;
  int32 error_code = 99;
  string access_token = 3;
}

message ValidateUserRequest {
  int64 user_id = 1;
  string username = 2;
  string token = 3;
}

message ValidateUserResponse {
  bool valid = 1;
  string username = 2;
  int64 user_id = 3;
  string role = 4;
  string error = 5;
  int32 error_code = 99;
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}
message ChangePasswordResponse { bool success = 1; string error = 2; int32 error_code = 99; }

message PhoneLoginRequest { string phone = 1; string otp = 2; }
