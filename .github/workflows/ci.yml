name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ===== Stage 1: 快速失败 — lint + 单元测试 (并行) =====
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - name: Go format check
        run: |
          cd cmd/server
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin
          cd ../../services/notify-service
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin

      - name: C++ auto-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          find server/src server/include -name '*.cpp' -o -name '*.h' | xargs clang-format -i
          echo "C++ files formatted"

      - name: C++ format check
        run: |
          find server/src server/include -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  # ===== Stage 2: 构建 + 集成测试 =====
  integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: lcb66699
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Pull upstream images (with retry)
        run: |
          IMAGES="nginx redis-cluster-1 redis-cluster-2 redis-cluster-3 \
                  redis-cluster-4 redis-cluster-5 redis-cluster-6 \
                  mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-1 \
                  mysql-file-0 mysql-file-1 minio elasticsearch jaeger"
          for img in $IMAGES; do
            for attempt in 1 2 3; do
              echo "[pull] $img attempt $attempt"
              if docker compose pull "$img" 2>&1; then
                echo "[pull] $img OK"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "[pull] $img FAILED after 3 attempts, continuing"
              else
                sleep $((attempt * 10))
              fi
            done
          done

      - name: Build images (BuildKit with cache mounts)
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          BUILDKIT_INLINE_CACHE: "1"
        run: docker compose build

      - name: Start services
        env:
          LOG_LEVEL: debug
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          rm -rf data/ 2>/dev/null || true
          docker compose up -d --no-build \
            envoy envoy-2 nginx grpc-gateway \
            auth-1 sheet-1 file-1 search \
            mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-0-slave mysql-spreadsheet-1 mysql-file-0 mysql-file-0-slave mysql-file-1 \
            minio minio-init redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init \
            elasticsearch es-init jaeger
          echo "Waiting for all containers healthy..."
          for i in $(seq 1 180); do
            TOTAL=$(docker compose ps -a --format json 2>/dev/null | wc -l)
            HEALTHY=$(docker compose ps -a --format json 2>/dev/null | grep -c '"Health":"healthy"' || true)
            EXITED_OK=$(docker compose ps -a --format json 2>/dev/null | grep -c '"ExitCode":0' || true)
            OK=$((HEALTHY + EXITED_OK))
            if [ "$OK" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "All containers healthy after ${i}s ($TOTAL total)"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "Timeout! unhealthy containers:"
              docker compose ps -a
              exit 1
            fi
            sleep 2
          done
          echo "=== Services status ==="
          docker compose ps

      - name: Debug - Nginx to Envoy connectivity
        run: |
          echo "=== Envoy port 10000 listening? ==="
          docker compose exec envoy netstat -tlnp 2>/dev/null || docker compose exec envoy ss -tlnp || echo "netstat/ss not available"
          echo "=== Envoy admin: listeners ==="
          curl -sS --max-time 5 http://localhost:9901/listeners 2>/dev/null || echo "admin port not exposed, try docker exec"
          echo "=== Envoy admin: clusters ==="
          curl -sS --max-time 5 http://localhost:9901/clusters 2>/dev/null || echo "admin port not exposed"
          echo "=== Envoy admin: config_dump (listeners only) ==="
          curl -sS --max-time 5 http://localhost:9901/config_dump?resource=dynamic_listeners 2>/dev/null || echo "config_dump not available"
          echo "=== Direct health check from runner -> gateway via docker ==="
          docker compose exec grpc-gateway wget -qO- --timeout=3 http://localhost:8080/api/v1/health 2>&1 || echo "FAIL direct gateway health check"
          echo "=== Docker network: nginx can ping envoy? ==="
          docker compose exec nginx ping -c1 -W2 envoy 2>&1 || echo "FAIL ping envoy from nginx"
          echo "=== Docker network: nginx can ping envoy-2? ==="
          docker compose exec nginx ping -c1 -W2 envoy-2 2>&1 || echo "FAIL ping envoy-2 from nginx"

      - name: Debug - Gateway container logs
        if: always()
        run: |
          echo "=== grpc-gateway logs ==="
          docker compose logs grpc-gateway --tail=30 2>&1 || true
          echo "=== grpc-gateway-2 logs ==="
          docker compose logs grpc-gateway-2 --tail=30 2>&1 || true

      - name: Functional tests
        run: bash test/e2e/functional_test.sh

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== sheet-1 ===" && docker compose logs sheet-1 --tail=40
          echo "=== file-1 ===" && docker compose logs file-1 --tail=40
          echo "=== grpc-gateway ===" && docker compose logs grpc-gateway --tail=20
          echo "=== auth-1 ===" && docker compose logs auth-1 --tail=10
          echo "=== mysql-spreadsheet-0 ===" && docker compose logs mysql-spreadsheet-0 --tail=10
          echo "=== mysql-spreadsheet-1 ===" && docker compose logs mysql-spreadsheet-1 --tail=10
          echo "=== envoy ===" && docker compose logs envoy --tail=20
          echo "=== envoy-2 ===" && docker compose logs envoy-2 --tail=20
          echo "=== nginx ===" && docker compose logs nginx --tail=20

  # ===== Stage 3: 推送镜像到 ghcr.io (仅 main 分支) =====
  push:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: lcb66699
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build & push
        env:
          DOCKER_USER: ghcr.io/lcb66699/http-rpc
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          docker compose build base-runtime auth-1 sheet-1 file-1 search grpc-gateway notify-service
          docker compose push base-runtime auth-1 sheet-1 file-1 search grpc-gateway notify-service

  # ===== Stage 4: 推送镜像到 ghcr.io + 生成本地部署脚本 =====
  deploy:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify images pushed to ghcr.io
        env:
          DOCKER_USER: ghcr.io/lcb66699/http-rpc
        run: |
          for img in base-runtime auth sheet file search gateway notify; do
            echo "=== verifying $DOCKER_USER/$img ==="
            docker manifest inspect "$DOCKER_USER/$img:latest" > /dev/null 2>&1 || \
              echo "WARNING: $img not found"
          done
          echo "All images verified"

      - name: Generate deploy-local.sh
        run: |
          cat > deploy-local.sh << 'SCRIPT'
          #!/usr/bin/env bash
          # ── 本地部署脚本 — 从 ghcr.io 拉取并启动服务 ──
          set -euo pipefail

          DOCKER_USER="${DOCKER_USER:-ghcr.io/lcb66699/http-rpc}"

          echo "=== 登录 ghcr.io ==="
          echo "请先创建 Personal Access Token: https://github.com/settings/tokens"
          echo "需勾选 read:packages 权限"
          if ! docker login ghcr.io -u lcb66699 --password-stdin < /dev/null 2>/dev/null; then
            echo "运行: echo <你的TOKEN> | docker login ghcr.io -u lcb66699 --password-stdin"
            exit 1
          fi

          echo "=== 拉取镜像 ==="
          export DOCKER_USER
          docker compose pull auth-1 sheet-1 file-1 search grpc-gateway notify-service

          echo "=== 启动服务 ==="
          docker compose up -d \
            envoy envoy-2 nginx grpc-gateway \
            auth-1 sheet-1 file-1 search \
            mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-0-slave mysql-spreadsheet-1 \
            mysql-file-0 mysql-file-0-slave mysql-file-1 \
            minio minio-init redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init \
            elasticsearch es-init jaeger rabbitmq mongodb

          echo "=== 等待服务就绪 ==="
          for i in $(seq 1 60); do
            TOTAL=$(docker compose ps -a --format json 2>/dev/null | wc -l)
            HEALTHY=$(docker compose ps -a --format json 2>/dev/null | grep -c '"Health":"healthy"' || true)
            EXITED_OK=$(docker compose ps -a --format json 2>/dev/null | grep -c '"ExitCode":0' || true)
            OK=$((HEALTHY + EXITED_OK))
            [ "$OK" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ] && break
            sleep 5
          done

          echo "=== 服务状态 ==="
          docker compose ps

          echo ""
          echo "部署完成！访问 https://localhost 查看"
          SCRIPT
          chmod +x deploy-local.sh

      - name: Upload deploy-local.sh as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-local-script
          path: deploy-local.sh
