# ===== API Gateway (Go gRPC-Gateway) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: http-rpc
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: http-rpc/gateway:latest
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
            - name: AUTH_ADDR
              value: "auth:50051"
            - name: SHEET_ADDR
              value: "sheet:50051"
            - name: FILE_ADDR
              value: "file:50051"
            - name: SEARCH_ADDR
              value: "search:50051"
            - name: REDIS_ADDR
              value: "redis-cluster:7000"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: http-rpc
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      name: http
