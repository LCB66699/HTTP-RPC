syntax = "proto3";

package rpc;

option go_package = "rpc-server/proto/rpc";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string token = 2;
  string error = 3;
  int64 user_id = 4;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  bool success = 1;
  string token = 2;
  string error = 3;
  int64 user_id = 4;
}
