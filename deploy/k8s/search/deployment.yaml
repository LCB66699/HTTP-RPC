# ===== Search Service =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: http-rpc
  labels:
    app: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: ghcr.io/lcb66699/http-rpc/search:latest
          ports:
            - containerPort: 50051
          env:
            - name: ES_HOST
              value: "http://elasticsearch:9200"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL:-INFO}"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["bash", "-c", "echo > /dev/tcp/localhost/50051"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rpc-search
  namespace: http-rpc
spec:
  selector:
    app: search
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
