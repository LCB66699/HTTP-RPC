worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    etag on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /dev/stdout;
    error_log /dev/stderr;

    limit_req_zone $binary_remote_addr zone=light_limit:10m rate=10000r/s;
    limit_req_zone $binary_remote_addr zone=heavy_limit:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=120r/m;

    upstream gateway_pool {
        least_conn;
        zone gateway_zone 64k;
        server envoy:10000 max_fails=10 fail_timeout=10s;
        server envoy-2:10000 max_fails=10 fail_timeout=10s;
        keepalive 128;
        keepalive_timeout 60s;
        keepalive_requests 10000;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"success":false,"error":"Rate limited","retry_after":30}';
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' wss:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'" always;
        }

        location ^~ /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/v1/login {
            limit_req zone=login_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            send_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location /api/v1/register {
            limit_req zone=login_limit burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            send_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location /api/v1/health {
            limit_req zone=light_limit burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
            send_timeout 5s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location /api/v1/ {
            limit_req zone=heavy_limit burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            send_timeout 120s;
            proxy_connect_timeout 3s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            client_max_body_size 50m;
        }
    }
}
