services:
  # ===== Nginx (TLS termination + rate limiting) =====
  nginx:
    build: { dockerfile: Dockerfile.nginx }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/app/web-ui:ro
    depends_on:
      envoy-1: { condition: service_healthy }
      envoy-2: { condition: service_healthy }

  # ===== MySQL Auth =====
  mysql-auth:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    volumes:
      - ./mysql/master/conf.d:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/mysql-auth:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== MySQL Spreadsheet (???) =====
  mysql-spreadsheet-0:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-sp-0:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-spreadsheet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-spreadsheet-0-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-sp-0s:/var/lib/mysql"]
    depends_on: [mysql-spreadsheet-0]

  mysql-spreadsheet-1:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-sp-1:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-spreadsheet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-spreadsheet-1-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-sp-1s:/var/lib/mysql"]
    depends_on: [mysql-spreadsheet-1]

  # ===== MySQL File (???) =====
  mysql-file-0:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-f-0:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-file]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-file-0-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-f-0s:/var/lib/mysql"]
    depends_on: [mysql-file-0]

  mysql-file-1:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-f-1:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-file]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-file-1-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-f-1s:/var/lib/mysql"]
    depends_on: [mysql-file-1]

  # ===== Redis Cluster (6 nodes, 3 masters + 3 replicas) =====
  redis-cluster-1:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-1:/data
    command: redis-server /usr/local/etc/redis/redis.conf --port 7000 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks:
      default:
        aliases: [redis-cluster, redis-cluster-7000]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 -a ${REDIS_PASSWORD:-rpc-redis-123456} ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-2:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-2:/data
    command: redis-server /usr/local/etc/redis/redis.conf --port 7001 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7001] } }

  redis-cluster-3:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-3:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7002 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7002] } }

  redis-cluster-4:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-4:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7003 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7003] } }

  redis-cluster-5:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-5:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7004 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7004] } }

  redis-cluster-6:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-6:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7005 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7005] } }

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
      - redis-cluster-6
    volumes:
      - ./redis/cluster/init.sh:/init.sh:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rpc-redis-123456}
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ===== Canal ? binlog subscription =====
  canal-server:
    image: canal/canal-server:v1.1.7
    ports: ["11111:11111"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - ./canal/server/canal.properties:/home/admin/canal-server/conf/canal.properties:ro
      - ./canal/server/instance.properties:/home/admin/canal-server/conf/spreadsheet/instance.properties:ro
      - ./data/canal-server/conf:/home/admin/canal-server/conf/spreadsheet
    restart: always
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy


  # ===== RabbitMQ ? ???? =====
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rpc
      RABBITMQ_DEFAULT_PASS: rpc-rabbit-123456
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===== MinIO Object Storage =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: rpc-minio
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
    volumes:
      - ./data/minio:/data
    networks:
      default:
        aliases: [minio]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 rpc-minio $${MINIO_ROOT_PASSWORD:-rpc-minio-123456}
        mc mb --ignore-existing local/rpc-files
        mc anonymous set download local/rpc-files
        echo "=== MinIO bucket ready ==="
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
    restart: "no"

  # ===== Envoy Proxy (2 instances, Nginx LB upstream) =====
  envoy-1:
    build:
      context: .
      dockerfile: envoy/Dockerfile
    ports:
      - "8080:8080"
      - "9901:9901"
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
    networks:
      default:
        aliases: [envoy]
    depends_on:
      - auth-1
      - sheet-1
      - file-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9901' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  envoy-2:
    build:
      context: .
      dockerfile: envoy/Dockerfile
    ports:
      - "9902:9901"
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
    networks:
      default:
        aliases: [envoy]
    depends_on:
      - auth-1
      - sheet-1
      - file-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9901' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ===== Elasticsearch =====
  elasticsearch:
    build:
      context: ./es
      dockerfile: Dockerfile
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - bootstrap.memory_lock=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ===== MongoDB =====
  mongodb:
    image: mongo:7.0
    command: mongod --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_DATABASE: rpc_search
    volumes:
      - ./data/mongodb:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ===== ES ????? =====
  es-init:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./es/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ===== Auth Service (2 instances) =====
  auth-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    image: ${DOCKER_USER:-http-rpc}/auth:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-auth --mysql-read-hosts mysql-auth --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth --mysql-shards 1
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  auth-2:
    image: ${DOCKER_USER:-http-rpc}/auth:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-auth --mysql-read-hosts mysql-auth --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth --mysql-shards 1
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== Sheet Service (2 instances) =====
  sheet-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: sheet
    image: ${DOCKER_USER:-http-rpc}/sheet:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-2:
    image: ${DOCKER_USER:-http-rpc}/sheet:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== File Service (2 instances) =====
  file-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: file
    image: ${DOCKER_USER:-http-rpc}/file:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-file --mysql-read-hosts mysql-file --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-file-0:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  file-2:
    image: ${DOCKER_USER:-http-rpc}/file:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-file --mysql-read-hosts mysql-file --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-file-0:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== Search Service (C++) =====
  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search
    image: ${DOCKER_USER:-http-rpc}/search:latest
    environment:
      ES_HOST: "http://elasticsearch:9200"
    command: >
      /app/rpc_server --service search --port 50051
    networks:
      default:
        aliases: [rpc-search]
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== gRPC-Gateway (Go) =====
  grpc-gateway:
    build:
      context: .
      dockerfile: gateway-grpc/Dockerfile
    image: ${DOCKER_USER:-http-rpc}/gateway:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      AUTH_ADDR: "rpc-auth:50051"
      SHEET_ADDR: "rpc-sheet:50051"
      REDIS_ADDR: "redis-cluster-7000:7000"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-rpc-redis-123456}"
      MONGO_URI: "mongodb://mongodb:27017"
      FILE_ADDR: "rpc-file:50051"
      SEARCH_ADDR: "rpc-search:50051"
    ports:
      - "8082:8080"
    depends_on:
      auth-1:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      file-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  grpc-gateway-2:
    build:
      context: .
      dockerfile: gateway-grpc/Dockerfile
    image: ${DOCKER_USER:-http-rpc}/gateway:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      AUTH_ADDR: "rpc-auth:50051"
      SHEET_ADDR: "rpc-sheet:50051"
      REDIS_ADDR: "redis-cluster-7000:7000"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-rpc-redis-123456}"
      MONGO_URI: "mongodb://mongodb:27017"
      FILE_ADDR: "rpc-file:50051"
      SEARCH_ADDR: "rpc-search:50051"
    networks:
      default:
        aliases: [grpc-gateway]
    depends_on:
      auth-1:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      file-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ===== Notify Service (Go consumer: RabbitMQ ? MongoDB + ES) =====
  notify-service:
    build:
      context: ./services/notify-service
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-http-rpc}/notify:latest
    environment:
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      RABBITMQ_USER: "rpc"
      RABBITMQ_PASS: "rpc-rabbit-123456"
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: "rpc_search"
      ES_HOST: "http://elasticsearch:9200"
      CANAL_MYSQL_HOST: "mysql-spreadsheet-0"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mysql-spreadsheet-0:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:
    driver: local
