# Envoy API Gateway — JWT 鉴权 (从 Cookie 提取验证) + 反向代理 + 熔断
# gRPC-JSON 转码待办: proto descriptor 兼容性问题

static_resources:
  listeners:
  - name: http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: api_routes
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: gateway, timeout: 30s }
          http_filters:
          # JWT 鉴权 — login/register/refresh 跳过
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                rpc_provider:
                  from_cookies: [rpc_at]
                  local_jwks:
                    inline_string: |
                      {"keys":[{"kty":"oct","k":"{{JWT_SECRET_B64}}","alg":"HS256"}]}
                  forward: true
                  forward_payload_header: x-jwt-username
              rules:
              - match: { prefix: "/api/health" }
              - match: { prefix: "/api/login" }
              - match: { prefix: "/api/register" }
              - match: { prefix: "/api/refresh" }
              - match: { prefix: "/" }
                requires: { provider_name: rpc_provider }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: gateway
    type: STRICT_DNS
    connect_timeout: 0.25s
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100
        max_pending_requests: 50
        max_requests: 200
        max_retries: 3
    outlier_detection:
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
      consecutive_5xx: 5
    load_assignment:
      cluster_name: gateway
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: "grpc-gateway", port_value: 8080 } } }

  # Search gRPC 服务 (Gateway 替代: 搜索直连 ES)
  - name: search_grpc
    type: STRICT_DNS
    connect_timeout: 0.25s
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 256
        max_pending_requests: 256
        max_requests: 256
        max_retries: 2
    load_assignment:
      cluster_name: search_grpc
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: "rpc-search", port_value: 50051 } } }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
