# Canal instance: spreadsheet
canal.instance.master.address = mysql-spreadsheet-0:3306
canal.instance.dbUsername = root
canal.instance.dbPassword = ${MYSQL_ROOT_PASSWORD:123456}
canal.instance.connectionCharset = UTF-8
canal.instance.enableDruid = false

# Binlog filter — only spreadsheet + file tables
canal.instance.filter.regex = rpc_spreadsheet\\.spreadsheets,rpc_file\\.files

# TSDB for cursor persistence (survives restart)
canal.instance.tsdb.enable = true
canal.instance.tsdb.dir = ${canal.instance.global.tsdb.dir}
canal.instance.tsdb.spring.xml = classpath:spring/tsdb/h2-tsdb.xml
