# ===== Notify Service (Go consumer) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify
  namespace: http-rpc
  labels:
    app: notify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notify
  template:
    metadata:
      labels:
        app: notify
    spec:
      containers:
        - name: notify
          image: ghcr.io/lcb66699/http-rpc/notify:latest
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017"
            - name: ES_HOST
              value: "http://elasticsearch:9200"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL:-INFO}"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
