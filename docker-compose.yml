services:
  nginx:
    build:
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/app/web-ui:ro
    depends_on:
      minio:
        condition: service_healthy
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy

  # ===== MySQL 主从 =====
  mysql-master:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    volumes:
      - ./mysql/master/conf.d:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/mysql-master:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-slave-1:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    volumes:
      - ./mysql/slave/conf.d:/etc/mysql/conf.d
      - ./mysql/slave/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh
      - ./data/mysql-slave-1:/var/lib/mysql
    networks:
      default:
        aliases: [mysql-slave]
    depends_on:
      mysql-master:
        condition: service_healthy

  mysql-slave-2:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    volumes:
      - ./mysql/slave/conf.d:/etc/mysql/conf.d
      - ./mysql/slave/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh
      - ./data/mysql-slave-2:/var/lib/mysql
    networks:
      default:
        aliases: [mysql-slave]
    depends_on:
      mysql-master:
        condition: service_healthy

  # ===== Redis Cluster (6 nodes, 3 masters + 3 replicas) =====
  redis-cluster-1:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-1:/data
    environment:
      REDIS_PORT: "7000"
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      default:
        aliases: [redis-cluster]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 -a ${REDIS_PASSWORD:-rpc-redis-123456} ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-2:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-2:/data
    environment:
      REDIS_PORT: "7001"
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      default:
        aliases: [redis-cluster]

  redis-cluster-3:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-3:/data
    environment:
      REDIS_PORT: "7002"
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      default:
        aliases: [redis-cluster]

  redis-cluster-4:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-4:/data
    environment:
      REDIS_PORT: "7003"
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      default:
        aliases: [redis-cluster]

  redis-cluster-5:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-5:/data
    environment:
      REDIS_PORT: "7004"
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      default:
        aliases: [redis-cluster]

  redis-cluster-6:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-6:/data
    environment:
      REDIS_PORT: "7005"
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      default:
        aliases: [redis-cluster]

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
      redis-cluster-6:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        echo yes | redis-cli --cluster create
          redis-cluster-1:7000 redis-cluster-2:7001 redis-cluster-3:7002
          redis-cluster-4:7003 redis-cluster-5:7004 redis-cluster-6:7005
          --cluster-replicas 1
          -a ${REDIS_PASSWORD:-rpc-redis-123456} &&
        echo '=== Redis Cluster initialized ==='
      "
    restart: "no"

  # ===== MinIO 对象存储 =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minio-rpc-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio-rpc-123456}"
    ports:
      - "9000:9000"   # S3 API (presigned URLs reachable from browser)
      - "9001:9001"   # MinIO Web Console
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket on first start; exits 0 so compose doesn't wait forever.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minio-rpc-admin} ${MINIO_ROOT_PASSWORD:-minio-rpc-123456} &&
        mc mb --ignore-existing local/rpc-files &&
        mc anonymous set download local/rpc-files &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  # ===== 应用服务 =====
  auth-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  auth-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-3:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  file-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      # MinIO S3 endpoint (inside Docker network) and credentials
      MINIO_ENDPOINT: "minio:9000"
      # Browser hits Nginx HTTPS and /minio-s3/ proxy (same Host as site); do not use :9000.
      MINIO_PUBLIC_URL: "https://localhost/minio-s3"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio-rpc-admin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio-rpc-123456}"
      MINIO_BUCKET: "rpc-files"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  file-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_URL: "https://localhost/minio-s3"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio-rpc-admin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio-rpc-123456}"
      MINIO_BUCKET: "rpc-files"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-master --mysql-read-hosts mysql-slave --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-master:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_gateway --port 8080
      --grpc-auth rpc-auth:50051
      --grpc-sheet rpc-sheet:50051
      --grpc-file rpc-file:50051
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      auth-1:
        condition: service_healthy
      auth-2:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      sheet-2:
        condition: service_healthy
      sheet-3:
        condition: service_healthy
      file-1:
        condition: service_healthy
      file-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_gateway --port 8080
      --grpc-auth rpc-auth:50051
      --grpc-sheet rpc-sheet:50051
      --grpc-file rpc-file:50051
      --redis-cluster redis-cluster:7000 --redis-cluster redis-cluster:7001 --redis-cluster redis-cluster:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      auth-1:
        condition: service_healthy
      auth-2:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      sheet-2:
        condition: service_healthy
      sheet-3:
        condition: service_healthy
      file-1:
        condition: service_healthy
      file-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
