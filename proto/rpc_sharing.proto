syntax = "proto3";
package rpc;

option go_package = "rpc-server/proto/rpc";

import "google/api/annotations.proto";

service SharingService {
  rpc Share(ShareRequest) returns (ShareResponse) {
    option (google.api.http) = {
      post: "/api/v1/sheets/{resource_id}/share"
      body: "*"
    };
  }
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/sheets/{resource_id}/share"
    };
  }
  rpc ListShares(ResourceRequest) returns (ShareListResponse) {
    option (google.api.http) = {
      get: "/api/v1/sheets/{resource_id}/share"
    };
  }
  rpc CreateShareLink(ShareLinkRequest) returns (ShareLinkResponse) {
    option (google.api.http) = {
      post: "/api/v1/sheets/{resource_id}/share-link"
      body: "*"
    };
  }
  rpc GetByToken(ShareTokenRequest) returns (SharedResourceResponse) {
    option (google.api.http) = {
      get: "/api/v1/s/{token}"
    };
  }
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse) {
    option (google.api.http) = {
      post: "/api/v1/access/check"
      body: "*"
    };
  }
}

message ShareRequest {
  int64 owner_id = 1;
  string resource_type = 2;  // "sheet" | "file"
  int64 resource_id = 3;
  string grantee_username = 4;
  string permission = 5;  // "view" | "edit"
}
message ShareResponse { bool success = 1; string error = 2; int32 error_code = 99; }

message RevokeRequest {
  int64 owner_id = 1;
  string resource_type = 2;
  int64 resource_id = 3;
  string grantee_username = 4;
}
message RevokeResponse { bool success = 1; string error = 2; int32 error_code = 99; }

message ResourceRequest {
  int64 owner_id = 1;
  string resource_type = 2;
  int64 resource_id = 3;
}

message AccessEntry {
  string username = 1;
  string permission = 2;
  string granted_at = 3;
}
message ShareListResponse {
  bool success = 1;
  repeated AccessEntry entries = 2;
  string error = 3;
  int32 error_code = 99;
}

message ShareLinkRequest {
  int64 owner_id = 1;
  string resource_type = 2;
  int64 resource_id = 3;
  string permission = 4;  // "view" | "edit"
}
message ShareLinkResponse {
  bool success = 1;
  string token = 2;
  string error = 3;
  int32 error_code = 99;
}

message ShareTokenRequest { string token = 1; }

message SharedResourceInfo {
  string resource_type = 1;
  int64 resource_id = 2;
  string permission = 3;
}
message SharedResourceResponse {
  bool success = 1;
  SharedResourceInfo info = 2;
  string error = 3;
  int32 error_code = 99;
}

message CheckAccessRequest {
  int64 user_id = 1;
  string resource_type = 2;  // "sheet" | "file"
  int64 resource_id = 3;
}
message CheckAccessResponse {
  bool allowed = 1;
  string permission = 2;  // "view" | "edit" | ""
}
