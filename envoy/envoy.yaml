# Envoy — 纯反向代理 + 熔断（JWT 鉴权已移至 gRPC-Gateway）

static_resources:
  listeners:
  - name: http_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: api_routes
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: gateway, timeout: 30s }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: gateway
    type: STRICT_DNS
    connect_timeout: 0.25s
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 100
        max_pending_requests: 50
        max_requests: 200
        max_retries: 3
    outlier_detection:
      interval: 10s
      base_ejection_time: 30s
      max_ejection_percent: 50
      consecutive_5xx: 5
    load_assignment:
      cluster_name: gateway
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: "grpc-gateway", port_value: 8080 } } }

  # Search gRPC (预留)
  - name: search_grpc
    type: STRICT_DNS
    connect_timeout: 0.25s
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 256
        max_pending_requests: 256
        max_requests: 256
        max_retries: 2
    load_assignment:
      cluster_name: search_grpc
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: "rpc-search", port_value: 50051 } } }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
