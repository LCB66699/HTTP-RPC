syntax = "proto3";

package rpc;

option go_package = "rpc-server/proto/rpc";

import "google/api/annotations.proto";

service SpreadsheetService {
  rpc CreateSpreadsheet(CreateSpreadsheetRequest) returns (CreateSpreadsheetResponse) {
    option (google.api.http) = {
      post: "/api/v1/sheets"
      body: "*"
    };
  }
  rpc GetSpreadsheet(GetSpreadsheetRequest) returns (GetSpreadsheetResponse) {
    option (google.api.http) = {
      get: "/api/v1/sheets/{id}"
    };
  }
  rpc ListSpreadsheets(ListSpreadsheetsRequest) returns (ListSpreadsheetsResponse) {
    option (google.api.http) = {
      get: "/api/v1/sheets"
    };
  }
  rpc UpdateSpreadsheet(UpdateSpreadsheetRequest) returns (UpdateSpreadsheetResponse) {
    option (google.api.http) = {
      put: "/api/v1/sheets/{id}"
      body: "*"
    };
  }
  rpc DeleteSpreadsheet(DeleteSpreadsheetRequest) returns (DeleteSpreadsheetResponse) {
    option (google.api.http) = {
      delete: "/api/v1/sheets/{id}"
    };
  }
}

message Spreadsheet {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string description = 4;
  string headers_json = 5;
  string data_json = 6;
  int32 row_count = 7;
  int32 col_count = 8;
  string created_at = 9;
  string updated_at = 10;
}

message SpreadsheetSummary {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int32 row_count = 4;
  int32 col_count = 5;
  string updated_at = 6;
}

// Requests identify the caller by user_id (integer FK to users.id).
// username is carried in gRPC metadata for logging only.
message CreateSpreadsheetRequest {
  int64 user_id = 1;
  string name = 2;
  string description = 3;
  string headers_json = 4;
  string data_json = 5;
  // Client-generated UUID for idempotency; empty = no dedup.
  string idempotency_key = 6;
}

message CreateSpreadsheetResponse {
  bool success = 1;
  int64 id = 2;
  string error = 3;
  int32 error_code = 99;
}

message GetSpreadsheetRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message GetSpreadsheetResponse {
  bool success = 1;
  Spreadsheet spreadsheet = 2;
  string cache_source = 3;
  string error = 4;
  int32 error_code = 99;
}

message ListSpreadsheetsRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  // Cursor pagination: 上一页最后一条 id, 0=首页
  int64 after_id = 4;
  int32 limit = 5;  // 默认 20
}

message ListSpreadsheetsResponse {
  bool success = 1;
  repeated SpreadsheetSummary sheets = 2;
  int32 total = 3;
  string cache_source = 4;
  string error = 5;
  string next_cursor = 6;  // 下一页 after_id
  bool has_more = 7;
  int32 error_code = 99;
}

message UpdateSpreadsheetRequest {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string description = 4;
  string headers_json = 5;
  string data_json = 6;
}

message UpdateSpreadsheetResponse {
  bool success = 1;
  string error = 2;
  int32 error_code = 99;
}

message DeleteSpreadsheetRequest {
  int64 id = 1;
  int64 user_id = 2;
}

message DeleteSpreadsheetResponse {
  bool success = 1;
  string error = 2;
  int32 error_code = 99;
}
