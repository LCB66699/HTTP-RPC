name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ===== Stage 1: 快速失败 — lint + 单元测试 (并行) =====
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - name: Go format check
        run: |
          cd cmd/gateway-grpc
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin
          cd ../../services/notify-service
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin

      - name: C++ auto-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          find server/src server/include -name '*.cpp' -o -name '*.h' | xargs clang-format -i
          echo "C++ files formatted"

      - name: C++ format check
        run: |
          find server/src server/include -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  # ===== Stage 2: 构建 + 集成测试 =====
  integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Build images
        run: docker compose build

      - name: Start services
        env:
          LOG_LEVEL: debug
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          rm -rf data/ 2>/dev/null || true
          docker compose up -d \
            nginx grpc-gateway \
            auth-1 sheet-1 file-1 search \
            mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-1 mysql-file-0 mysql-file-1 \
            minio minio-init redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init \
            elasticsearch es-init jaeger
          echo "Waiting for all containers healthy..."
          for i in $(seq 1 180); do
            TOTAL=$(docker compose ps -a --format json 2>/dev/null | wc -l)
            HEALTHY=$(docker compose ps -a --format json 2>/dev/null | grep -c '"Health":"healthy"' || true)
            # 有些容器没有 healthcheck (如 es-init, minio-init)，算 they exited 0
            EXITED_OK=$(docker compose ps -a --format json 2>/dev/null | grep -c '"ExitCode":0' || true)
            OK=$((HEALTHY + EXITED_OK))
            if [ "$OK" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "All containers healthy after ${i}s ($TOTAL total)"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "Timeout! unhealthy containers:"
              docker compose ps -a
              exit 1
            fi
            sleep 2
          done
          echo "=== Services status ==="
          docker compose ps

      - name: Functional tests
        run: bash test/functional_test.sh

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== sheet-1 ==="
          docker compose logs sheet-1 --tail=40
          echo "=== file-1 ==="
          docker compose logs file-1 --tail=20
          echo "=== mysql-spreadsheet-0 ==="
          docker compose logs mysql-spreadsheet-0 --tail=10
          echo "=== mysql-spreadsheet-1 ==="
          docker compose logs mysql-spreadsheet-1 --tail=10
          echo "=== nginx ==="
          docker compose logs nginx --tail=20

  # ===== Stage 3: 推送镜像到 ghcr.io (仅 main 分支) =====
  push:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        env:
          DOCKER_USER: ghcr.io/lcb66699/http-rpc
        run: |
          docker compose build auth-1 sheet-1 file-1 search grpc-gateway notify-service
          docker compose push auth-1 sheet-1 file-1 search grpc-gateway notify-service
