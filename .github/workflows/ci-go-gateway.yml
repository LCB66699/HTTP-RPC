name: CI Go Gateway

on:
  push:
    branches-ignore: [main]
    paths:
      - 'cmd/server/**'
      - 'proto/*.proto'
  pull_request:
    paths:
      - 'cmd/server/**'
      - 'proto/*.proto'
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.24.2" }

      - name: Go test
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          cd cmd/server
          for attempt in 1 2 3; do
            if go test ./... -v -count=1; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            go clean -modcache
            sleep $((attempt * 5))
          done

      - name: Go build
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          cd cmd/server
          go build -o /dev/null ./...
