name: CI C++ Search

on:
  push:
    paths:
      - 'server/src/search/**'
      - 'server/src/shared/**'
      - 'server/include/shared/**'
      - 'proto/rpc_search.proto'
      - 'proto/rpc_common.proto'
      - 'CMakeLists.txt'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'server/src/search/**'
      - 'server/src/shared/**'
      - 'server/include/shared/**'
      - 'proto/rpc_search.proto'
      - 'proto/rpc_common.proto'
      - 'CMakeLists.txt'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  search-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build search image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: SERVICE=search
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          push: false

      - name: Start minimal services
        env:
          JWT_SECRET: ci-test-secret-32bytes-here!!!!
        run: |
          docker compose up -d consul elasticsearch es-init
          for i in $(seq 1 90); do
            if docker compose ps consul | grep -q 'healthy' && \
               docker compose ps elasticsearch | grep -q 'healthy'; then
              echo "infra ready after ${i}s"
              break
            fi
            [ "$i" -eq 90 ] && { echo "timeout"; docker compose ps; exit 1; }
            sleep 2
          done
          docker compose up -d search
          sleep 10

      - name: Verify services
        run: |
          docker compose exec search /usr/local/bin/grpc_health_probe -addr=localhost:50051
          echo "Search health check passed"

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose logs search --tail=40
          docker compose logs consul --tail=10
