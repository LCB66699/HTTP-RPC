# Envoy edge proxy for HTTP-RPC
# Sits between Nginx and Go Gateway. Handles:
#   cluster-level circuit breaking, retry, health checking
# CORS and JWT validation stay in Go gateway (less config friction).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: public_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          use_remote_address: true

          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # Health check — pass through to gateway
              - match: { prefix: "/api/v1/health" }
                route:
                  cluster: gateway_cluster
                  timeout: 5s

              # Default API routes — retry for idempotent GET
              - match:
                  prefix: "/api/v1/"
                  headers:
                  - name: ":method"
                    string_match: { exact: "GET" }
                route:
                  cluster: gateway_cluster
                  timeout: 15s
                  retry_policy:
                    retry_on: "connect-failure,refused-stream,unavailable,reset"
                    num_retries: 3

              # Default API routes — non-GET, no retry
              - match: { prefix: "/api/v1/" }
                route:
                  cluster: gateway_cluster
                  timeout: 15s

              # Static frontend — direct passthrough
              - match: { prefix: "/" }
                route:
                  cluster: gateway_cluster
                  timeout: 30s

  clusters:
  - name: gateway_cluster
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    connect_timeout: 3s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}

    # ---- Circuit breaking ----
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 200
        max_pending_requests: 100
        max_requests: 400
        max_retries: 6

    # ---- Outlier detection (eject unhealthy instances) ----
    outlier_detection:
      consecutive_5xx: 5
      interval: 30s
      base_ejection_time: 30s
      max_ejection_percent: 50
      consecutive_gateway_failure: 5

    # ---- Active health checking ----
    health_checks:
    - timeout: 2s
      interval: 5s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: /api/v1/health

    load_assignment:
      cluster_name: gateway_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: grpc-gateway, port_value: 8080 }
        - endpoint:
            address:
              socket_address: { address: grpc-gateway-2, port_value: 8080 }
