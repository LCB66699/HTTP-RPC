services:
  # ===== Nginx (TLS termination + rate limiting) =====
  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/app/web-ui:ro
      - ./certs:/certs
    entrypoint: >
      sh -c "mkdir -p /certs && openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /certs/server.key -out /certs/server.crt -subj '/CN=luochuanbaiRPC' 2>/dev/null; nginx -g 'daemon off;'"
    depends_on:
      envoy:
        condition: service_healthy

  # ===== Envoy replicas (edge proxy: CORS, circuit breaking, retry) =====
  envoy:
    image: envoyproxy/envoy:v1.31.3
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "10000:10000"
      - "9901:9901"
    depends_on: [grpc-gateway, grpc-gateway-2]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/10000"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  envoy-2:
    image: envoyproxy/envoy:v1.31.3
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "10001:10000"
      - "9902:9901"
    depends_on: [grpc-gateway, grpc-gateway-2]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/10000"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  # ===== MySQL Auth =====
  mysql-auth:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    volumes:
      - ./deploy/mysql/master/conf.d:/etc/mysql/conf.d
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/mysql-auth:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== MySQL Spreadsheet (???) =====
  mysql-spreadsheet-0:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-sp-0:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-spreadsheet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-spreadsheet-0-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_MASTER_HOST: mysql-spreadsheet-0
    volumes:
      - "./deploy/mysql/slave/conf.d:/etc/mysql/conf.d"
      - "./deploy/mysql/slave/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh"
      - "./data/mysql-sp-0s:/var/lib/mysql"
    networks:
      default:
        aliases: [mysql-spreadsheet-r, mysql-spreadsheet-r-0]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: [mysql-spreadsheet-0]

  mysql-spreadsheet-1:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-sp-1:/var/lib/mysql"]
    # mysql-spreadsheet-1 不共享 mysql-spreadsheet 别名。--mysql-shards 2 时
    # 作为分片 1 写主机（ShardFor(user_id%2)==1 → mysql-spreadsheet-1）。
    # mysql-spreadsheet-0 仍作为 "mysql-spreadsheet" 服务（分片 0 写主机）。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-spreadsheet-1-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_MASTER_HOST: mysql-spreadsheet-1
    volumes:
      - "./deploy/mysql/slave1/conf.d:/etc/mysql/conf.d"
      - "./deploy/mysql/slave/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh"
      - "./data/mysql-sp-1s:/var/lib/mysql"
    networks:
      default:
        aliases: [mysql-spreadsheet-r-1]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: [mysql-spreadsheet-1]

  # ===== MySQL File (???) =====
  mysql-file-0:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-f-0:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-file]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-file-0-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_MASTER_HOST: mysql-file-0
    volumes:
      - "./deploy/mysql/slave/conf.d:/etc/mysql/conf.d"
      - "./deploy/mysql/slave/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh"
      - "./data/mysql-f-0s:/var/lib/mysql"
    networks:
      default:
        aliases: [mysql-file-r, mysql-file-r-0]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: [mysql-file-0]

  mysql-file-1:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-f-1:/var/lib/mysql"]
    # mysql-file-1 不共享 mysql-file 别名。--mysql-shards 2 时
    # 作为分片 1 写主机（ShardFor(user_id%2)==1 → mysql-file-1）。
    # mysql-file-0 仍作为 "mysql-file" 服务（分片 0 写主机）。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-file-1-slave:
    image: mysql:8.0
    command: --innodb-buffer-pool-size=32M --innodb-log-buffer-size=4M --innodb-log-file-size=16M --performance-schema=OFF --skip-innodb-doublewrite
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_MASTER_HOST: mysql-file-1
    volumes:
      - "./deploy/mysql/slave1/conf.d:/etc/mysql/conf.d"
      - "./deploy/mysql/slave/init-slave.sh:/docker-entrypoint-initdb.d/init-slave.sh"
      - "./data/mysql-f-1s:/var/lib/mysql"
    networks:
      default:
        aliases: [mysql-file-r-1]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on: [mysql-file-1]

  # ===== Redis Cluster (6 nodes, 3 masters + 3 replicas) =====
  redis-cluster-1:
    image: redis:7-alpine
    volumes:
      - ./deploy/redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-1:/data
    command: redis-server /usr/local/etc/redis/redis.conf --port 7000 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --cluster-announce-hostname redis-cluster-1 --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks:
      default:
        aliases: [redis-cluster, redis-cluster-7000]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 -a ${REDIS_PASSWORD:-rpc-redis-123456} ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-2:
    image: redis:7-alpine
    volumes:
      - ./deploy/redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-2:/data
    command: redis-server /usr/local/etc/redis/redis.conf --port 7001 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --cluster-announce-hostname redis-cluster-2 --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7001] } }

  redis-cluster-3:
    image: redis:7-alpine
    volumes: [./deploy/redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-3:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7002 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --cluster-announce-hostname redis-cluster-3 --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7002] } }

  redis-cluster-4:
    image: redis:7-alpine
    volumes: [./deploy/redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-4:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7003 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --cluster-announce-hostname redis-cluster-4 --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7003] } }

  redis-cluster-5:
    image: redis:7-alpine
    volumes: [./deploy/redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-5:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7004 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --cluster-announce-hostname redis-cluster-5 --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7004] } }

  redis-cluster-6:
    image: redis:7-alpine
    volumes: [./deploy/redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-6:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7005 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456} --cluster-announce-hostname redis-cluster-6 --maxmemory 32mb --maxmemory-policy allkeys-lru
    networks: { default: { aliases: [redis-cluster, redis-cluster-7005] } }

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
      - redis-cluster-6
    volumes:
      - ./deploy/redis/cluster/init.sh:/init.sh:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rpc-redis-123456}
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ===== RabbitMQ ? ???? =====
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rpc
      RABBITMQ_DEFAULT_PASS: rpc-rabbit-123456
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===== MinIO Object Storage =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: rpc-minio
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
    volumes:
      - ./data/minio:/data
    networks:
      default:
        aliases: [minio]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 rpc-minio $${MINIO_ROOT_PASSWORD:-rpc-minio-123456}
        mc mb --ignore-existing local/rpc-files
        mc anonymous set download local/rpc-files
        echo "=== MinIO bucket ready ==="
    environment:
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
    restart: "no"

  # ===== Elasticsearch =====
  elasticsearch:
    build:
      context: ./deploy/es
      dockerfile: Dockerfile
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - bootstrap.memory_lock=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ===== MongoDB =====
  mongodb:
    image: mongo:7.0
    command: mongod --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_DATABASE: rpc_search
    volumes:
      - ./data/mongodb:/data/db
      - ./deploy/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ===== ES ????? =====
  es-init:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./deploy/es/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ===== Auth Service (2 instances) =====
  auth-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    image: ${DOCKER_USER:-http-rpc}/auth:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-auth --mysql-read-hosts mysql-auth --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth --mysql-shards 1
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  auth-2:
    image: ${DOCKER_USER:-http-rpc}/auth:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-auth --mysql-read-hosts mysql-auth --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth --mysql-shards 1
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== Sheet Service (2 instances) =====
  sheet-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: sheet
    image: ${DOCKER_USER:-http-rpc}/sheet:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongodb:27017}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet-r --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      mysql-spreadsheet-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-2:
    image: ${DOCKER_USER:-http-rpc}/sheet:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongodb:27017}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet-r --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      mysql-spreadsheet-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== File Service (2 instances) =====
  file-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: file
    image: ${DOCKER_USER:-http-rpc}/file:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-file --mysql-read-hosts mysql-file-r --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-file-0:
        condition: service_healthy
      mysql-file-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  file-2:
    image: ${DOCKER_USER:-http-rpc}/file:latest
    environment:
      AUTH_SVC_ADDR: "rpc-auth:50051"
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      MINIO_PUBLIC_URL: "http://localhost:9000"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-file --mysql-read-hosts mysql-file-r --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-file-0:
        condition: service_healthy
      mysql-file-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== Search Service (C++) =====
  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: search
    image: ${DOCKER_USER:-http-rpc}/search:latest
    environment:
      ES_HOST: "http://elasticsearch:9200"
    command: >
      /app/rpc_server --service search --port 50051
    networks:
      default:
        aliases: [rpc-search]
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ===== gRPC-Gateway (Go) =====
  grpc-gateway:
    build:
      context: .
      dockerfile: cmd/gateway-grpc/Dockerfile
    image: ${DOCKER_USER:-http-rpc}/gateway:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      AUTH_ADDR: "rpc-auth:50051"
      SHEET_ADDR: "rpc-sheet:50051"
      REDIS_ADDR: "redis-cluster-7000:7000"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-rpc-redis-123456}"
      MONGO_URI: "mongodb://mongodb:27017"
      FILE_ADDR: "rpc-file:50051"
      SEARCH_ADDR: "rpc-search:50051"
    ports:
      - "8082:8080"
    depends_on:
      auth-1:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      file-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  grpc-gateway-2:
    build:
      context: .
      dockerfile: cmd/gateway-grpc/Dockerfile
    image: ${DOCKER_USER:-http-rpc}/gateway:latest
    environment:
      JWT_SECRET: "${JWT_SECRET:-default-secret-32bytes-here!!!!!}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      AUTH_ADDR: "rpc-auth:50051"
      SHEET_ADDR: "rpc-sheet:50051"
      REDIS_ADDR: "redis-cluster-7000:7000"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-rpc-redis-123456}"
      MONGO_URI: "mongodb://mongodb:27017"
      FILE_ADDR: "rpc-file:50051"
      SEARCH_ADDR: "rpc-search:50051"
    networks:
      default:
        aliases: [grpc-gateway]
    depends_on:
      auth-1:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      file-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ===== Notify Service (Go consumer: RabbitMQ ? MongoDB + ES) =====
  notify-service:
    build:
      context: ./services/notify-service
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-http-rpc}/notify:latest
    environment:
      RABBITMQ_HOST: "rabbitmq"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "rpc-minio"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-rpc-minio-123456}"
      MINIO_BUCKET: "rpc-files"
      RABBITMQ_USER: "rpc"
      RABBITMQ_PASS: "rpc-rabbit-123456"
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: "rpc_search"
      ES_HOST: "http://elasticsearch:9200"
      CANAL_MYSQL_HOST: "mysql-spreadsheet-0"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      REDIS_ADDR: "redis-cluster-7000:7000"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-rpc-redis-123456}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mysql-spreadsheet-0:
        condition: service_healthy
    restart: unless-stopped

  # ===== Prometheus Monitoring =====
  prometheus:
    image: prom/prometheus:v2.54.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - grpc-gateway
      - grpc-gateway-2
    restart: unless-stopped

  # ===== Grafana Dashboard =====
  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus
    restart: unless-stopped

  # ===== Jaeger Tracing =====
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "16686:16686"  # Jaeger UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  es_data:
    driver: local
