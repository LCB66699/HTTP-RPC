syntax = "proto3";
package rpc;

service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string query = 1;
  string scope = 2;
  string sort = 3;
  int32 page = 4;
  int32 page_size = 5;
  int64 user_id = 6;
  bool is_admin = 7;
}

message SearchResponse {
  bool success = 1;
  string error = 2;
  int64 total = 3;
  int32 page = 4;
  int32 page_size = 5;
  repeated SearchResult results = 6;
}

message SearchResult {
  string type = 1;
  string id = 2;
  double score = 3;
  string name = 4;
  string description = 5;
  string username = 6;
  int32 row_count = 7;
  int32 col_count = 8;
  string updated_at = 9;
  string original_name = 10;
  string mime_type = 11;
  int64 size = 12;
  string created_at = 13;
  string highlight = 14;
}
