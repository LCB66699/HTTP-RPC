root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/gateway ."
  bin = "tmp/gateway"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "vendor"]
  include_dir = []
  exclude_file = []
  log = "build-errors.log"
  delay = 500
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
