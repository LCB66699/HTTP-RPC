# Envoy edge proxy for HTTP-RPC
# Sits between Nginx and Go Gateway. Handles:
#   JWT authn, CORS, cluster-level circuit breaking, retry, health checking
#
# JWT validation: reads "rpc_at" cookie, validates HMAC-SHA256 signature,
# injects x-rpc-uid and x-rpc-username headers from JWT claims.
# Public endpoints (login, register, refresh, health, metrics) bypass JWT.
# CORS preflight OPTIONS is also bypassed (handled by CORS filter + allow_missing).
#
# The JWT secret is provided via JWT_SECRET env var at container start;
# the entrypoint script generates /etc/envoy/jwt/jwks.json from it.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: public_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 10000 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          use_remote_address: true

          http_filters:
          # JWT authentication — validates rpc_at cookie, injects headers
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                rpc_jwt_provider:
                  forward: true
                  forward_payload_header: x-jwt-payload
                  from_cookies:
                  - rpc_at
                  claim_to_headers:
                  - header_name: x-rpc-uid
                    claim_name: uid
                  - header_name: x-rpc-username
                    claim_name: username
                  local_jwks:
                    filename: /etc/envoy/jwt/jwks.json
              rules:
              # Public endpoints — JWT optional
              - match: { prefix: "/api/v1/login" }
                requires: { allow_missing: {} }
              - match: { prefix: "/api/v1/register" }
                requires: { allow_missing: {} }
              - match: { prefix: "/api/v1/refresh" }
                requires: { allow_missing: {} }
              - match: { prefix: "/api/v1/health" }
                requires: { allow_missing: {} }
              - match: { prefix: "/api/v1/metrics" }
                requires: { allow_missing: {} }
              # Default — JWT required for all other API paths.
              # OPTIONS preflight requests are handled by the CORS filter
              # (responded directly, not forwarded through the filter chain).
              - match: { prefix: "/" }
                requires: { provider_name: rpc_jwt_provider }

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              # Health check — pass through to gateway
              - match: { prefix: "/api/v1/health" }
                route:
                  cluster: gateway_cluster
                  timeout: 5s

              # Default API routes — retry for idempotent GET
              - match:
                  prefix: "/api/v1/"
                  headers:
                  - name: ":method"
                    string_match: { exact: "GET" }
                route:
                  cluster: gateway_cluster
                  timeout: 15s
                  retry_policy:
                    retry_on: "connect-failure,refused-stream,unavailable,reset"
                    num_retries: 3

              # Default API routes — non-GET, no retry
              - match: { prefix: "/api/v1/" }
                route:
                  cluster: gateway_cluster
                  timeout: 15s

              # Static frontend — direct passthrough
              - match: { prefix: "/" }
                route:
                  cluster: gateway_cluster
                  timeout: 30s

  clusters:
  - name: gateway_cluster
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    connect_timeout: 3s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}

    # ---- Circuit breaking ----
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 200
        max_pending_requests: 100
        max_requests: 400
        max_retries: 6

    # ---- Outlier detection (eject unhealthy instances) ----
    outlier_detection:
      consecutive_5xx: 5
      interval: 30s
      base_ejection_time: 30s
      max_ejection_percent: 50
      consecutive_gateway_failure: 5

    # ---- Active health checking ----
    health_checks:
    - timeout: 2s
      interval: 5s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: /api/v1/health

    load_assignment:
      cluster_name: gateway_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: grpc-gateway, port_value: 8080 }
        - endpoint:
            address:
              socket_address: { address: grpc-gateway-2, port_value: 8080 }
