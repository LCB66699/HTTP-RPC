syntax = "proto3";

package rpc;

option go_package = "rpc-server/proto/rpc";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateUser(ValidateUserRequest) returns (ValidateUserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc SendOTP(SendOTPRequest) returns (SendOTPResponse);
  rpc LoginByPhone(PhoneLoginRequest) returns (LoginResponse);
  rpc BindPhone(BindPhoneRequest) returns (BindPhoneResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string error = 3;
  int32 error_code = 99;  // 0=OK, 1=BAD_REQUEST, 2=UNAUTH, 3=FORBIDDEN, 4=NOT_FOUND, 5=CONFLICT, 6=INTERNAL, 7=UNAVAILABLE
  int64 user_id = 4;
  string access_token = 5;      // JWT, 15min
  string refresh_token = 6;     // UUID, 7d
  string role = 7;              // admin / user
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  bool success = 1;
  string error = 3;
  int32 error_code = 99;
  int64 user_id = 4;
  string access_token = 5;
  string refresh_token = 6;
  string role = 7;
}

message RefreshTokenRequest {
  string username = 1;
  string refresh_token = 2;
}

message RefreshTokenResponse {
  bool success = 1;
  string error = 2;
  int32 error_code = 99;
  string access_token = 3;
}

message ValidateUserRequest {
  int64 user_id = 1;
  string username = 2;
  string token = 3;
}

message ValidateUserResponse {
  bool valid = 1;
  string username = 2;
  int64 user_id = 3;
  string role = 4;
  string error = 5;
  int32 error_code = 99;
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}
message ChangePasswordResponse { bool success = 1; string error = 2; int32 error_code = 99; }

message SendOTPRequest { string phone = 1; }
message SendOTPResponse { bool success = 1; string error = 2; int32 error_code = 99; }

message PhoneLoginRequest { string phone = 1; string otp = 2; }

message BindPhoneRequest {
  int64 user_id = 1;
  string phone = 2;
  string otp = 3;
}
message BindPhoneResponse { bool success = 1; string error = 2; int32 error_code = 99; }

message UpdateProfileRequest {
  int64 user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
}
message UpdateProfileResponse { bool success = 1; string error = 2; int32 error_code = 99; }
