services:
  # ===== LVS + Keepalived (4层负载均衡, DR模式) =====
  lvs-master:
    build:
      context: ./lvs
    cap_add: [NET_ADMIN, SYS_MODULE]
    network_mode: host
    environment:
      - VIP=${LVS_VIP:-192.168.1.100}
      - ROLE=MASTER
      - PRIORITY=100

  lvs-backup:
    build:
      context: ./lvs
    cap_add: [NET_ADMIN, SYS_MODULE]
    network_mode: host
    environment:
      - VIP=${LVS_VIP:-192.168.1.100}
      - ROLE=BACKUP
      - PRIORITY=90

  # ===== nginx ×3 (LVS real servers) =====
  nginx-1:
    build: { dockerfile: Dockerfile.nginx }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/app/web-ui:ro
    command: >
      sh -c "/usr/local/bin/realserver.sh && nginx -g 'daemon off;'"
    depends_on: [gateway-1, gateway-2]

  nginx-2:
    build: { dockerfile: Dockerfile.nginx }
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/app/web-ui:ro
    command: >
      sh -c "/usr/local/bin/realserver.sh && nginx -g 'daemon off;'"
    depends_on: [gateway-1, gateway-2]

  nginx-3:
    build: { dockerfile: Dockerfile.nginx }
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web-ui:/app/web-ui:ro
    command: >
      sh -c "/usr/local/bin/realserver.sh && nginx -g 'daemon off;'"
    depends_on: [gateway-1, gateway-2]

  # ===== MySQL Auth (不分片) =====
  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
    volumes:
      - ./mysql/master/conf.d:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/mysql-auth:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== MySQL Spreadsheet (双分片, 每片1主1从) =====
  mysql-spreadsheet-0:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-sp-0:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-spreadsheet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-spreadsheet-0-slave:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-sp-0s:/var/lib/mysql"]
    depends_on: [mysql-spreadsheet-0]

  mysql-spreadsheet-1:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-sp-1:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-spreadsheet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-spreadsheet-1-slave:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-sp-1s:/var/lib/mysql"]
    depends_on: [mysql-spreadsheet-1]

  # ===== MySQL File (双分片, 每片1主1从) =====
  mysql-file-0:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-f-0:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-file]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-file-0-slave:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-f-0s:/var/lib/mysql"]
    depends_on: [mysql-file-0]

  mysql-file-1:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql", "./data/mysql-f-1:/var/lib/mysql"]
    networks:
      default:
        aliases: [mysql-file]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-file-1-slave:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}" }
    volumes: ["./mysql/slave/conf.d:/etc/mysql/conf.d", "./data/mysql-f-1s:/var/lib/mysql"]
    depends_on: [mysql-file-1]

  # ===== Redis Cluster (6 nodes, 3 masters + 3 replicas) =====
  redis-cluster-1:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-1:/data
    command: redis-server /usr/local/etc/redis/redis.conf --port 7000 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [redis-cluster, redis-cluster-7000]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 -a ${REDIS_PASSWORD:-rpc-redis-123456} ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-2:
    image: redis:7-alpine
    volumes:
      - ./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-cluster-2:/data
    command: redis-server /usr/local/etc/redis/redis.conf --port 7001 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [redis-cluster, redis-cluster-7001]

  redis-cluster-3:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-3:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7002 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456}
    networks: { default: { aliases: [redis-cluster, redis-cluster-7002] } }

  redis-cluster-4:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-4:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7003 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456}
    networks: { default: { aliases: [redis-cluster, redis-cluster-7003] } }

  redis-cluster-5:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-5:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7004 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456}
    networks: { default: { aliases: [redis-cluster, redis-cluster-7004] } }

  redis-cluster-6:
    image: redis:7-alpine
    volumes: [./redis/cluster/redis.conf:/usr/local/etc/redis/redis.conf, ./data/redis-cluster-6:/data]
    command: redis-server /usr/local/etc/redis/redis.conf --port 7005 --requirepass ${REDIS_PASSWORD:-rpc-redis-123456} --masterauth ${REDIS_PASSWORD:-rpc-redis-123456}
    networks: { default: { aliases: [redis-cluster, redis-cluster-7005] } }

  redis-cluster-init:
    image: redis:7-alpine
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
      - redis-cluster-6
    volumes:
      - ./redis/cluster/init.sh:/init.sh:ro
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rpc-redis-123456}
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # ===== MinIO 对象存储 =====
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minio-rpc-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio-rpc-123456}"
    ports:
      - "9000:9000"   # S3 API (presigned URLs reachable from browser)
      - "9001:9001"   # MinIO Web Console
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket on first start; exits 0 so compose doesn't wait forever.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minio-rpc-admin} ${MINIO_ROOT_PASSWORD:-minio-rpc-123456} &&
        mc mb --ignore-existing local/rpc-files &&
        mc anonymous set download local/rpc-files &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  # ===== 应用服务 =====
  auth-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-auth --mysql-read-hosts mysql-auth --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth --mysql-shards 1
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  auth-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service auth --port 50051
      --mysql-write-host mysql-auth --mysql-read-hosts mysql-auth --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_auth --mysql-shards 1
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-auth]
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sheet-3:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
    command: >
      /app/rpc_server --service spreadsheet --port 50051
      --mysql-write-host mysql-spreadsheet --mysql-read-hosts mysql-spreadsheet --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_spreadsheet --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-sheet]
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  file-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      # MinIO S3 endpoint (inside Docker network) and credentials
      MINIO_ENDPOINT: "minio:9000"
      # Browser hits Nginx HTTPS and /minio-s3/ proxy (same Host as site); do not use :9000.
      MINIO_PUBLIC_URL: "https://localhost/minio-s3"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio-rpc-admin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio-rpc-123456}"
      MINIO_BUCKET: "rpc-files"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-file --mysql-read-hosts mysql-file --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-auth:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  file-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_URL: "https://localhost/minio-s3"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio-rpc-admin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio-rpc-123456}"
      MINIO_BUCKET: "rpc-files"
    command: >
      /app/rpc_server --service file --port 50051
      --mysql-write-host mysql-file --mysql-read-hosts mysql-file --mysql-password ${MYSQL_ROOT_PASSWORD:-123456} --mysql-db rpc_file --mysql-shards 2
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    networks:
      default:
        aliases: [rpc-file]
    depends_on:
      mysql-auth:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50051' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway-1:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_USERS: "${ADMIN_USERS:-}"
    command: >
      /app/rpc_gateway --port 8080
      --grpc-auth rpc-auth:50051
      --grpc-sheet rpc-sheet:50051
      --grpc-file rpc-file:50051
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      auth-1:
        condition: service_healthy
      auth-2:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      sheet-2:
        condition: service_healthy
      sheet-3:
        condition: service_healthy
      file-1:
        condition: service_healthy
      file-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway-2:
    build: .
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_USERS: "${ADMIN_USERS:-}"
    command: >
      /app/rpc_gateway --port 8080
      --grpc-auth rpc-auth:50051
      --grpc-sheet rpc-sheet:50051
      --grpc-file rpc-file:50051
      --redis-cluster redis-cluster-7000:7000 --redis-cluster redis-cluster-7001:7001 --redis-cluster redis-cluster-7002:7002 --redis-password ${REDIS_PASSWORD:-rpc-redis-123456}
    depends_on:
      mysql-spreadsheet-0:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      auth-1:
        condition: service_healthy
      auth-2:
        condition: service_healthy
      sheet-1:
        condition: service_healthy
      sheet-2:
        condition: service_healthy
      sheet-3:
        condition: service_healthy
      file-1:
        condition: service_healthy
      file-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
