name: CI Integration

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - "cmd/server/**"
      - "server/**"
      - "proto/**"
      - "test/e2e/**"
      - "Dockerfile.nginx"
      - "docker-compose.yml"
      - "docker-compose.frontend.yml"
      - "deploy/nginx/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "cmd/server/**"
      - "server/**"
      - "proto/**"
      - "test/e2e/**"
      - "Dockerfile.nginx"
      - "docker-compose.yml"
      - "docker-compose.frontend.yml"
      - "deploy/nginx/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full API and browser test suites
        type: boolean
        required: false
        default: false

jobs:
  # ===== Stage 1: 全量构建 + E2E 集成测试 =====
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_FILE: docker-compose.yml
      DOCKER_USER: ${{ github.ref == 'refs/heads/main' && 'ghcr.io/lcb66699/http-rpc' || 'http-rpc' }}
      RABBITMQ_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      GRAFANA_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Compose frontend configuration
        shell: bash
        run: |
          if [[ -f docker-compose.frontend.yml ]]; then
            echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.frontend.yml' >> "$GITHUB_ENV"
          fi

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Pull upstream images (with retry)
        run: |
          IMAGES="redis-cluster-1 redis-cluster-2 redis-cluster-3 \
                  redis-cluster-4 redis-cluster-5 redis-cluster-6 \
                  mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-1 \
                  mysql-file-0 mysql-file-1 minio elasticsearch jaeger"
          for img in $IMAGES; do
            for attempt in 1 2 3; do
              echo "[pull] $img attempt $attempt"
              if docker compose pull "$img" 2>&1; then
                echo "[pull] $img OK"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "[pull] $img FAILED after 3 attempts, continuing"
              else
                sleep $((attempt * 10))
              fi
            done
          done

      - name: Build base-runtime (shared C++ base)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base-runtime
          tags: ${{ env.DOCKER_USER }}/base-runtime:latest
          cache-from: type=gha,scope=base-runtime
          cache-to: type=gha,scope=base-runtime,mode=max
          load: true
          push: false

      - name: Build auth
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=auth
          tags: ${{ env.DOCKER_USER }}/auth:latest
          cache-from: type=gha,scope=auth
          cache-to: type=gha,scope=auth,mode=max
          load: true
          push: false

      - name: Build sheet
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=sheet
          tags: ${{ env.DOCKER_USER }}/sheet:latest
          cache-from: type=gha,scope=sheet
          cache-to: type=gha,scope=sheet,mode=max
          load: true
          push: false

      - name: Build file
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=file
          tags: ${{ env.DOCKER_USER }}/file:latest
          cache-from: type=gha,scope=file
          cache-to: type=gha,scope=file,mode=max
          load: true
          push: false

      - name: Build search
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=search
          tags: ${{ env.DOCKER_USER }}/search:latest
          cache-from: type=gha,scope=search
          cache-to: type=gha,scope=search,mode=max
          load: true
          push: false

      - name: Build gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/server/Dockerfile
          tags: ${{ env.DOCKER_USER }}/gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
          load: true
          push: false

      - name: Build notify
        uses: docker/build-push-action@v7
        with:
          context: ./services/notify-service
          tags: ${{ env.DOCKER_USER }}/notify:latest
          cache-from: type=gha,scope=notify
          cache-to: type=gha,scope=notify,mode=max
          load: true
          push: false

      - name: Build points
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/points-server/Dockerfile
          tags: ${{ env.DOCKER_USER }}/points:latest
          cache-from: type=gha,scope=points
          cache-to: type=gha,scope=points,mode=max
          load: true
          push: false

      - name: Build mall
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/mall-server/Dockerfile
          tags: ${{ env.DOCKER_USER }}/mall:latest
          cache-from: type=gha,scope=mall
          cache-to: type=gha,scope=mall,mode=max
          load: true
          push: false

      - name: Build infrastructure images
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: |
          docker compose build envoy envoy-2 elasticsearch nginx

      - name: Start services
        env:
          LOG_LEVEL: debug
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          rm -rf data/ 2>/dev/null || true
          docker compose up -d --no-build \
            envoy envoy-2 nginx grpc-gateway \
            auth-1 sheet-1 file-1 search \
            mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-0-slave mysql-spreadsheet-1 mysql-file-0 mysql-file-0-slave mysql-file-1 \
            minio minio-init redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init \
            elasticsearch es-init jaeger
          echo "Waiting for all containers healthy..."
          for i in $(seq 1 180); do
            TOTAL=$(docker compose ps -a --format json 2>/dev/null | wc -l)
            HEALTHY=$(docker compose ps -a --format json 2>/dev/null | grep -c '"Health":"healthy"' || true)
            EXITED_OK=$(docker compose ps -a --format json 2>/dev/null | grep -c '"ExitCode":0' || true)
            OK=$((HEALTHY + EXITED_OK))
            if [ "$OK" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "All containers healthy after ${i}s ($TOTAL total)"
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "Timeout! unhealthy containers:"
              docker compose ps -a
              exit 1
            fi
            sleep 2
          done
          echo "=== Services status ==="
          docker compose ps

      - name: Debug - Nginx to Envoy connectivity
        run: |
          echo "=== Envoy port 10000 listening? ==="
          docker compose exec envoy netstat -tlnp 2>/dev/null || docker compose exec envoy ss -tlnp || echo "netstat/ss not available"
          echo "=== Envoy admin: listeners ==="
          curl -sS --max-time 5 http://localhost:9901/listeners 2>/dev/null || echo "admin port not exposed, try docker exec"
          echo "=== Envoy admin: clusters ==="
          curl -sS --max-time 5 http://localhost:9901/clusters 2>/dev/null || echo "admin port not exposed"
          echo "=== Envoy admin: config_dump (listeners only) ==="
          curl -sS --max-time 5 http://localhost:9901/config_dump?resource=dynamic_listeners 2>/dev/null || echo "config_dump not available"
          echo "=== Direct health check from runner -> gateway via docker ==="
          docker compose exec grpc-gateway wget -qO- --timeout=3 http://localhost:8080/api/v1/health 2>&1 || echo "FAIL direct gateway health check"
          echo "=== Docker network: nginx can ping envoy? ==="
          docker compose exec nginx ping -c1 -W2 envoy 2>&1 || echo "FAIL ping envoy from nginx"
          echo "=== Docker network: nginx can ping envoy-2? ==="
          docker compose exec nginx ping -c1 -W2 envoy-2 2>&1 || echo "FAIL ping envoy-2 from nginx"

      - name: Debug - Gateway container logs
        if: always()
        run: |
          echo "=== grpc-gateway logs ==="
          docker compose logs --tail=30 grpc-gateway 2>&1 || docker compose logs grpc-gateway 2>&1 || true
          echo "=== grpc-gateway-2 logs ==="
          docker compose logs --tail=30 grpc-gateway-2 2>&1 || docker compose logs grpc-gateway-2 2>&1 || true

      - name: Restart nginx to reconnect envoy
        if: always()
        run: |
          docker compose restart nginx
          sleep 5
          echo "=== Test nginx -> envoy -> gateway ==="
          docker compose exec nginx sh -c "wget -qO- --timeout=5 http://envoy:10000/api/v1/health 2>&1 || echo 'FAIL nginx->envoy'"

      - name: API smoke check
        run: |
          set -euo pipefail
          response=$(curl -ksf https://localhost/api/v1/health)
          echo "$response"
          echo "$response" | grep -q 'gateway'

      - name: Full API functional tests
        if: ${{ inputs.full_e2e == true }}
        run: bash test/e2e/functional_test.sh

      - uses: actions/setup-node@v6
        with: { node-version: "24" }

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/playwright/package.json') }}

      - name: Install Playwright dependencies
        working-directory: test/e2e/playwright
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/e2e/playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (Playwright)
        run: |
          cd test/e2e/playwright
          npx playwright test e2e.spec.js --grep "renders points and mall routes" --reporter=list

      - name: Full browser E2E tests (Playwright)
        if: ${{ inputs.full_e2e == true }}
        run: |
          cd test/e2e/playwright
          npx playwright test --reporter=list

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test/e2e/playwright/test-results/

      - name: Container logs on failure
        if: failure()
        run: |
          echo "=== sheet-1 ===" && docker compose logs --tail=40 sheet-1
          echo "=== file-1 ===" && docker compose logs --tail=40 file-1
          echo "=== grpc-gateway ===" && docker compose logs --tail=20 grpc-gateway
          echo "=== auth-1 ===" && docker compose logs --tail=10 auth-1
          echo "=== mysql-spreadsheet-0 ===" && docker compose logs --tail=10 mysql-spreadsheet-0
          echo "=== mysql-spreadsheet-1 ===" && docker compose logs --tail=10 mysql-spreadsheet-1
          echo "=== envoy ===" && docker compose logs --tail=20 envoy
          echo "=== envoy-2 ===" && docker compose logs --tail=20 envoy-2
          echo "=== nginx ===" && docker compose logs --tail=20 nginx

      - name: Login to GHCR for main image publish
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose push \
            base-runtime envoy envoy-2 elasticsearch nginx \
            auth-1 sheet-1 file-1 search grpc-gateway notify-service points-server mall-server

  # ===== Stage 3: 推送镜像到 ghcr.io (仅 main 分支) =====
  # ===== Stage 4: 推送镜像到 ghcr.io + 生成本地部署脚本 =====
  deploy:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, docker-desktop]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_USER: ghcr.io/lcb66699/http-rpc
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate deployment secrets
        shell: powershell
        run: |
          $required = @(
            'JWT_SECRET',
            'REDIS_PASSWORD',
            'MYSQL_ROOT_PASSWORD',
            'MINIO_ACCESS_KEY',
            'MINIO_ROOT_PASSWORD',
            'RABBITMQ_PASSWORD',
            'GRAFANA_ADMIN_PASSWORD'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Missing production secrets: $($missing -join ', ')"
          }

      - name: Check Docker Desktop
        shell: powershell
        run: |
          docker version
          docker compose version

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull application images
        shell: powershell
        run: |
          $compose = @('-f', 'docker-compose.yml')
          if (Test-Path 'docker-compose.frontend.yml') {
            $compose += @('-f', 'docker-compose.frontend.yml')
          }
          $compose += @('-f', 'docker-compose.ci.yml')
          docker compose @compose pull

      - name: Start application stack
        shell: powershell
        run: |
          $compose = @('-f', 'docker-compose.yml')
          if (Test-Path 'docker-compose.frontend.yml') {
            $compose += @('-f', 'docker-compose.frontend.yml')
          }
          $compose += @('-f', 'docker-compose.ci.yml')
          docker compose @compose up -d --no-build --remove-orphans --wait --wait-timeout 300
          $health = curl.exe -kfsS --retry 5 --retry-all-errors https://localhost/api/v1/health
          if ($health -notmatch '"gateway"') {
            throw 'Deployment health endpoint did not report a ready gateway.'
          }
          Write-Output $health
          docker compose @compose ps

      - name: Show deployment diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          $compose = @('-f', 'docker-compose.yml')
          if (Test-Path 'docker-compose.frontend.yml') {
            $compose += @('-f', 'docker-compose.frontend.yml')
          }
          $compose += @('-f', 'docker-compose.ci.yml')
          docker compose @compose ps -a
          docker compose @compose logs --tail 100

      - name: Generate deploy-local.sh
        if: ${{ false }}
        run: |
          cat > deploy-local.sh << 'SCRIPT'
          #!/usr/bin/env bash
          # ── 本地部署脚本 — 从 ghcr.io 拉取并启动服务 ──
          set -euo pipefail

          DOCKER_USER="${DOCKER_USER:-ghcr.io/lcb66699/http-rpc}"

          echo "=== 登录 ghcr.io ==="
          echo "请先创建 Personal Access Token: https://github.com/settings/tokens"
          echo "需勾选 read:packages 权限"
          if ! docker login ghcr.io -u lcb66699 --password-stdin < /dev/null 2>/dev/null; then
            echo "运行: echo <你的TOKEN> | docker login ghcr.io -u lcb66699 --password-stdin"
            exit 1
          fi

          echo "=== 拉取镜像 ==="
          export DOCKER_USER
          docker compose pull auth-1 sheet-1 file-1 search grpc-gateway notify-service

          echo "=== 启动服务 ==="
          docker compose up -d \
            envoy envoy-2 nginx grpc-gateway \
            auth-1 sheet-1 file-1 search \
            mysql-auth mysql-spreadsheet-0 mysql-spreadsheet-0-slave mysql-spreadsheet-1 \
            mysql-file-0 mysql-file-0-slave mysql-file-1 \
            minio minio-init redis-cluster-1 redis-cluster-2 redis-cluster-3 \
            redis-cluster-4 redis-cluster-5 redis-cluster-6 redis-cluster-init \
            elasticsearch es-init jaeger rabbitmq mongodb

          echo "=== 等待服务就绪 ==="
          for i in $(seq 1 60); do
            TOTAL=$(docker compose ps -a --format json 2>/dev/null | wc -l)
            HEALTHY=$(docker compose ps -a --format json 2>/dev/null | grep -c '"Health":"healthy"' || true)
            EXITED_OK=$(docker compose ps -a --format json 2>/dev/null | grep -c '"ExitCode":0' || true)
            OK=$((HEALTHY + EXITED_OK))
            [ "$OK" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ] && break
            sleep 5
          done

          echo "=== 服务状态 ==="
          docker compose ps

          echo ""
          echo "部署完成！访问 https://localhost 查看"
          SCRIPT
          chmod +x deploy-local.sh

      - name: Upload deploy-local.sh as artifact
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-local-script
          path: deploy-local.sh
