global_defs {
    router_id LVS_HTTPRPC
}

vrrp_instance VI_1 {
    state {{ROLE}}
    interface eth0
    virtual_router_id 51
    priority {{PRIORITY}}
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass httprpc123
    }
    virtual_ipaddress {
        {{VIP}}/24 dev eth0
    }
}

virtual_server {{VIP}} 443 {
    delay_loop 6
    lb_algo wlc
    lb_kind DR
    protocol TCP

    real_server nginx-1 443 {
        weight 1
        TCP_CHECK { connect_port 443; connect_timeout 3; retry 3; delay_before_retry 3; }
    }
    real_server nginx-2 443 {
        weight 1
        TCP_CHECK { connect_port 443; connect_timeout 3; }
    }
    real_server nginx-3 443 {
        weight 1
        TCP_CHECK { connect_port 443; connect_timeout 3; }
    }
}

virtual_server {{VIP}} 80 {
    delay_loop 6
    lb_algo wlc
    lb_kind DR
    protocol TCP

    real_server nginx-1 80 {
        weight 1
        TCP_CHECK { connect_port 80; connect_timeout 3; }
    }
    real_server nginx-2 80 {
        weight 1
        TCP_CHECK { connect_port 80; connect_timeout 3; }
    }
    real_server nginx-3 80 {
        weight 1
        TCP_CHECK { connect_port 80; connect_timeout 3; }
    }
}
