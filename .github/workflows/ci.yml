name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker system prune -af

      - name: Build all services
        run: |
          set -e
          for svc in auth-1 sheet-1 file-1 search grpc-gateway notify-service nginx envoy; do
            echo "=== Building $svc ==="
            docker compose build "$svc" || { echo "Failed: $svc"; exit 1; }
          done

      - name: Start stack and wait
        run: |
          docker compose up -d
          echo "Waiting for health..."
          for i in $(seq 1 90); do
            if curl -sk https://localhost/api/health 2>/dev/null | grep -q gateway; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout — checking logs:"
          docker compose ps
          docker compose logs --tail=30
          exit 1

      - name: Functional test
        run: bash test/functional_test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
