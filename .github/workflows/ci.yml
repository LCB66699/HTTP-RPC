name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ===== Stage 1: 快速失败 — lint + 单元测试 (并行) =====
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - name: Go lint
        run: |
          cd gateway-grpc
          go vet ./...
          gofmt -l . | tee /dev/stderr | test ! -s /dev/stdin

      - name: Go unit tests
        run: cd gateway-grpc && go test -v -race -count=1 ./...

      - name: C++ format check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          find server/src -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  # ===== Stage 2: 构建 + 集成测试 =====
  integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/setup-buildx-action@v3

      - name: Build images (cached)
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for health..."
          for i in $(seq 1 90); do
            if curl -sk https://localhost/api/health 2>/dev/null | grep -q gateway; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "=== Services status ==="
          docker compose ps
          echo "=== Recent logs ==="
          docker compose logs --tail=80
          exit 1

      - name: Functional tests
        run: bash test/functional_test.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
