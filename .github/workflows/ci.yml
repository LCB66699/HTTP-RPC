name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Build & start
        run: |
          docker compose build
          docker compose up -d
          echo "Waiting for health..."
          for i in $(seq 1 90); do
            if curl -sk https://localhost/api/health 2>/dev/null | grep -q gateway; then
              echo "Ready after ${i}s"
              bash test/functional_test.sh
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=50
          exit 1
