name: CI C++ File

on:
  pull_request:
    paths:
      - 'server/src/file/**'
      - 'server/src/shared/**'
      - 'server/include/file/**'
      - 'server/include/shared/**'
      - 'proto/rpc_file.proto'
      - 'proto/rpc_common.proto'
      - 'CMakeLists.txt'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  file-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          build-args: SERVICE=file
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          push: false
          tags: cpp-builder:latest

      - name: Run C++ unit tests
        run: |
          docker run --rm cpp-builder:latest sh -c "
            cd /src &&
            cmake --build build --target cpp_test -j\$(nproc) &&
            ./build/cpp_test
          "

      - name: Build file runtime image (compilation check)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: SERVICE=file
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          push: false
