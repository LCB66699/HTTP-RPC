name: CI Go Gateway

on:
  push:
    branches-ignore: [main]
    paths:
      - 'cmd/server/**'
      - 'proto/*.proto'
      - '.github/workflows/ci-go-gateway.yml'
  pull_request:
    paths:
      - 'cmd/server/**'
      - 'proto/*.proto'
      - '.github/workflows/ci-go-gateway.yml'
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: cmd/server/go.sum

      - name: Go test
        run: |
          cd cmd/server
          go test ./... -v -count=1

      - name: Go build
        run: |
          cd cmd/server
          go build -o /dev/null ./...
